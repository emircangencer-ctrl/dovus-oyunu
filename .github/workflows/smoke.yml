name: Yayın duman testi

# Elle çalıştırılır: yayındaki bir adresi (üretim ya da dal önizlemesi) uçtan uca denetler.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Denetlenecek adres (ör. https://asama-0-dovus-oyunu.<alt-alan>.workers.dev)"
        required: true
      expect_version:
        description: "Beklenen 7 karakterlik commit kodu (boş bırakılabilir)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: Duman testi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sağlık ucu (ham yanıt)
        env:
          URL: ${{ inputs.url }}
        run: curl -sS -i --max-time 20 "$URL/api/health" || true
      - run: pnpm exec playwright install --with-deps chromium
      - name: Duman testi
        env:
          E2E_BASE_URL: ${{ inputs.url }}
          E2E_EXPECT_VERSION: ${{ inputs.expect_version }}
        run: pnpm e2e smoke --project=chromium
